[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "convertit"
version = "1.0.0"
description = "Conversor profissional de documentos via CLI"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "typer>=0.9.0",
    "loguru>=0.7.0",
    "pandas>=2.0.0",
    "pdf2docx>=0.5.8",
    "pymupdf>=1.23.0",
    "python-docx>=1.1.0",
    "reportlab>=4.0.0",
    "rich>=13.0.0",
    "pytest>=7.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.scripts]
convertit = "src.cli:app"